<!DOCTYPE html>
<html>
<head>

<title>Gesture Prediction</title>
<link rel="stylesheet" href="/static/css/style.css">

<style>

#historyBox{
    width:640px;
    margin-top:20px;
    background:#ffffff22;
    padding:15px;
    border-radius:10px;
    color:white;
}

#gestureList{
    list-style:none;
    padding:0;
}

#gestureList li{
    padding:5px;
    margin:5px;
    background:#ffffff22;
    border-radius:5px;
}

.camera-container img{
    width:640px;
    border-radius:15px;
}

</style>

</head>

<body>

<div class="module-page">

    <h1 style="color: white;">Gesture Prediction</h1>

    <p style="color: white;">
        Detects and classifies static hand gestures
        in real time.
    </p>

    <div class="controls">

        <button id="startBtn">
            Start Camera
        </button>

        <button id="stopBtn">
            Stop Camera
        </button>

        <a href="/dashboard">
            <button>
                Dashboard
            </button>
        </a>

    </div>

    <div class="camera-container">

        <img
            id="videoFeed"
            src=""
        >

    </div>

    <div class="stats-row">

        <div class="stat-card">
            <h3>Camera:</h3>
            <p id="cameraStatus">Offline</p>
        </div>

        <div class="stat-card">
            <h3>Prediction:</h3>
            <p id="predictionText">None</p>
        </div>

    </div>

</div>

<script>

let historyInterval = null;
let predictionInterval = null;

document.getElementById("startBtn").onclick = startCamera;
document.getElementById("stopBtn").onclick = stopCamera;

function startCamera(){

    document.getElementById(
        "videoFeed"
    ).src="/video_feed";

    document.getElementById(
        "cameraStatus"
    ).textContent="Online";

    historyInterval = setInterval(
        updateHistory,
        1000
    );

    predictionInterval = setInterval(
        updatePrediction,
        500
    );
}

function stopCamera(){

    document.getElementById(
        "videoFeed"
    ).src="";

    document.getElementById(
        "cameraStatus"
    ).textContent="Offline";

    clearInterval(historyInterval);
    clearInterval(predictionInterval);
}

function updateHistory(){

    fetch("/gesture_history")
    .then(res => res.json())
    .then(data => {

        let list =
            document.getElementById(
                "gestureList"
            );

        list.innerHTML = "";

        data.forEach(g => {

            let li =
                document.createElement(
                    "li"
                );

            li.textContent = g;

            list.appendChild(li);

        });

    });

}

function updatePrediction(){

    fetch("/current_prediction")
    .then(res => res.json())
    .then(data => {

        document.getElementById(
            "predictionText"
        ).textContent =
            data.prediction;

        document.getElementById(
            "gestureCount"
        ).textContent =
            data.count;

    });

}

</script>

</body>
</html>
